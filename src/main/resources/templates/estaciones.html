<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Estaciones</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/gestionar_isla.css}">
</head>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="fragment/sidebar :: sidebar"></div>

<div class="container py-4">
    <h2><i class="bi bi-building"></i> Gestionar Estaciones</h2>

    <!-- Formulario -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <i class="bi bi-plus-circle"></i>
            <span th:if="${estacion.idestacion == null}">Nueva Estación</span>
            <span th:if="${estacion.idestacion != null}">Editar Estación</span>
        </div>
        <div class="card-body">
            <form th:action="@{/estaciones/guardar}" method="post" th:object="${estacion}">
                <input type="hidden" th:field="*{idestacion}" />

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">NIT</label>
                    <input type="text" th:field="*{nit}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" th:field="*{direccion}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a th:href="@{/estaciones}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

    <!-- Tabla de estaciones -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            Lista de Estaciones
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>NIT</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estaciones}">
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.nit}"></td>
                    <td th:text="${e.direccion}"></td>
                    <td>
                        <a th:href="@{/estaciones/editar/{id}(id=${e.idestacion})}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/estaciones/eliminar/{id}(id=${e.idestacion})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Eliminar esta estación?');">
                            <i class="bi bi-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
