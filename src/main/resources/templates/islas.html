<!-- templates/islas.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Islas</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/gestionar_isla.css}">
</head>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="fragment/sidebar :: sidebar"></div>

<!-- Contenido principal -->
<div style="flex: 1;">
    <div class="container-fluid mt-4">
        <h3><i class="bi bi-fuel-pump"></i> GESTIONAR ISLAS</h3>

        <div class="my-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">Formulario de Isla</div>
                <div class="card-body">
                    <form th:action="@{/isla/guardar}" th:object="${isla}" method="post" class="mb-4">
                        <input type="hidden" th:field="*{idIsla}"/>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nombre Isla</label>
                                <input type="text" th:field="*{isla}" class="form-control" required/>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Estación</label>
                                <select th:field="*{estacion.idestacion}" class="form-select">
                                    <option value="">Seleccione una estación</option>
                                    <option th:each="estacion : ${estaciones}"
                                            th:value="${estacion.idestacion}"
                                            th:text="${estacion.nombre}">
                                    </option>
                                </select>

                            </div>


                        </div>

                        <button type="submit" class="btn btn-success btn-lg shadow mt-3">
                            <i class="bi bi-check-circle"></i> Guardar Isla
                        </button>
                    </form>
                    <div class="row g-3">
                        <div class="col-md-4 ms-auto">
                            <div class="input-group">
                                        <span class="input-group-text">
                                           <i class="bi bi-search"></i>
                                                 </span>
                                <input type="text"
                                       id="buscador"
                                       class="form-control"
                                       placeholder="Buscar por Estación">
                            </div>
                        </div>
                    </div>
                    <!-- Tabla de Islas -->
                    <table class="table table-bordered align-middle text-center">
                        <thead>
                        <tr>
                            <th>Isla</th>
                            <th>Estación</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="isla : ${islas}">
                            <td th:text="${isla.isla}"></td>
                            <td th:text="${isla.estacion != null ? isla.estacion.nombre : 'Sin estación'}"></td>
                            <td>
                                <a th:href="@{'/isla/editar/' + ${isla.idIsla}}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{'/isla/eliminar/' + ${isla.idIsla}}"
                                   onclick="return confirm('¿Seguro que deseas eliminar esta isla?');"
                                   class="btn btn-danger btn-sm">Eliminar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("buscador").addEventListener("keyup", function () {
        const filtro = this.value.toLowerCase();
        const filas = document.querySelectorAll("table tbody tr");

        filas.forEach(fila => {
            fila.style.display = fila.innerText.toLowerCase().includes(filtro)
                ? ""
                : "none";
        });
    });
</script>

</body>
</html>
