<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Turnos</title>

    <!-- ✅ CLAVE PARA RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/gestionar_isla.css}">
</head>

<body class="bg-light">

<div class="main-container">

    <div class="container py-4">

        <!-- BOTÓN VOLVER -->
        <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
            <a th:href="@{/menuEmpleado}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver al menú
            </a>

            <!-- BUSCADOR -->
            <div class="col-12 col-md-4">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text"
                           id="buscador"
                           class="form-control"
                           placeholder="Buscar por fecha, turno, isla, estado...">
                </div>
            </div>
        </div>

        <!-- ENCABEZADO -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4 class="mb-1">
                    <i class="bi bi-clock-history"></i> Historial de Turnos
                </h4>
                <p class="mb-0 text-muted">
                    Empleado:
                    <strong th:text="${empleado.nombre}"></strong> |
                    Estación:
                    <strong th:text="${empleado.estacion.nombre}"></strong>
                </p>
            </div>
        </div>

        <!-- TABLA -->
        <div class="card shadow-sm">
            <div class="card-body p-0">

                <!-- 🔹 Responsive table -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th># Turno</th>
                            <th>Fecha</th>
                            <th>Isla</th>
                            <th>Venta</th>
                            <th>Efectivo</th>
                            <th>Diferencia</th>
                            <th>Estado</th>
                            <th class="text-center">PDF</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="venta : ${historial}">
                            <td th:text="${venta.turno.numeroTurno}"></td>
                            <td th:text="${venta.turno.fecha}"></td>
                            <td th:text="'Isla ' + ${venta.turno.isla.isla}"></td>

                            <td>$ <span th:text="${venta.total}"></span></td>
                            <td>$ <span th:text="${venta.efectivo_final}"></span></td>
                            <td>$ <span th:text="${venta.diferencia}"></span></td>

                            <td>
                                <span class="badge bg-success"
                                      th:if="${venta.turno.estado == 'CERRADO'}">
                                    CERRADO
                                </span>
                                <span class="badge bg-warning text-dark"
                                      th:if="${venta.turno.estado != 'CERRADO'}">
                                    ACTIVO
                                </span>
                            </td>

                            <td class="text-center">
                                <a class="btn btn-sm btn-outline-danger"
                                   th:href="@{'/liquidar/reporte?turnoId=' + ${venta.turno.idTurno}}"
                                   target="_blank">
                                    <i class="bi bi-file-earmark-pdf"></i>
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(historial)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                No hay registros de turnos para mostrar.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("buscador").addEventListener("keyup", function () {
        const filtro = this.value.toLowerCase();
        document.querySelectorAll("tbody tr").forEach(fila => {
            fila.style.display = fila.innerText.toLowerCase().includes(filtro) ? "" : "none";
        });
    });
</script>

</body>
</html>
