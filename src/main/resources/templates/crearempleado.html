<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleado - COMBUGAS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Font Awesome (manteniendo compatibilidad) -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}" />
    <style>
        /* Variables CSS para consistencia */
        :root {
            --primary-color: #28a745;
            --secondary-color: #20c997;
            --accent-color: #17a2b8;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --info-color: #17a2b8;
        }

        /* Background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        /* Botón de regreso flotante */
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 0.75rem 1.25rem;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-back:hover {
            background: white;
            color: var(--primary-color);
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* Container principal */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Card principal */
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        /* Header del formulario */
        .form-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .form-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(180deg);
            }
        }

        .form-header h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .form-header .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.5rem;
            position: relative;
            z-index: 1;
        }

        /* Body del formulario */
        .form-body {
            padding: 2.5rem 2rem;
        }

        /* Grupos de formulario mejorados */
        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-control-custom {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem 1rem 1rem 3rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            min-height: 56px;
            position: relative;
        }

        .form-control-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
            background: white;
            transform: translateY(-2px);
            outline: none;
        }

        .form-control-custom.is-valid {
            border-color: var(--success-color);
            background-image: none;
        }

        .form-control-custom.is-invalid {
            border-color: var(--danger-color);
            background-image: none;
        }

        /* Iconos en inputs */
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.1rem;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .form-control-custom:focus + .input-icon {
            color: var(--primary-color);
        }

        /* Select personalizado */
        .select-custom {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 3rem;
        }

        /* Campo de contraseña con toggle */
        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 1.1rem;
            z-index: 3;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        /* Badges para roles */
        .role-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
            background: white;
        }

        .role-option:hover {
            border-color: var(--primary-color);
            background: rgba(40, 167, 69, 0.05);
            transform: translateY(-2px);
        }

        .role-option.selected {
            border-color: var(--primary-color);
            background: rgba(40, 167, 69, 0.1);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-admin {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .role-empleado {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
        }

        .role-supervisor {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
        }

        /* Botones */
        .btn-save {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            min-height: 56px;
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
            background: linear-gradient(135deg, #218838, #1e7e34);
            color: white;
        }

        .btn-save:active {
            transform: translateY(0);
        }

        /* Validación visual */
        .validation-feedback {
            display: block;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            padding-left: 3rem;
        }

        .valid-feedback {
            color: var(--success-color);
        }

        .invalid-feedback {
            color: var(--danger-color);
        }

        /* Indicador de fortaleza de contraseña */
        .password-strength {
            margin-top: 0.5rem;
            padding-left: 3rem;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: #e9ecef;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak {
            background: var(--danger-color);
            width: 25%;
        }
        .strength-fair {
            background: var(--warning-color);
            width: 50%;
        }
        .strength-good {
            background: var(--info-color);
            width: 75%;
        }
        .strength-strong {
            background: var(--success-color);
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-body {
                padding: 2rem 1.5rem;
            }

            .btn-back {
                top: 10px;
                left: 10px;
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .form-control-custom {
                min-height: 48px;
                font-size: 16px; /* Previene zoom en iOS */
            }
        }

        /* Animaciones de entrada */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading state */
        .btn-save.loading {
            pointer-events: none;
            position: relative;
        }

        .btn-save.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<!-- Botón de regreso -->
<a th:href="@{/empleado}" class="btn-back">
    <i class="bi bi-arrow-left me-2"></i>
    <span class="d-none d-sm-inline">Regresar a Lista</span>
    <span class="d-sm-none">Volver</span>
</a>

<!-- Container principal -->

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="form-card shadow-sm rounded-3 p-4 p-md-5 fade-in">
                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-person-gear text-primary" style="font-size: 2.5rem;"></i>
                    </div>
                    <h1 class="h3 fw-bold" th:text="${empleado.idEmpleado != null} ? 'Editar Empleado' : 'Nuevo Empleado'">
                        Datos del Empleado
                    </h1>
                    <p class="text-muted">
                        <span th:if="${empleado.idEmpleado != null}">Modifica la información del empleado</span>
                        <span th:unless="${empleado.idEmpleado != null}">Completa los datos del nuevo empleado</span>
                    </p>
                </div>

                <!-- Formulario -->
                <form th:action="@{/empleado/guardar}" method="post" th:object="${empleado}" id="employeeForm" novalidate>
                    <!-- Campo oculto ID -->
                    <input type="hidden" name="idEmpleado" th:field="*{idEmpleado}" />

                    <div class="row g-4">
                        <!-- Columna 1: Datos personales -->
                        <div class="col-12 col-lg-6">
                            <h5 class="mb-3 text-secondary fw-semibold">
                                <i class="bi bi-card-text me-2"></i>Información Personal
                            </h5>

                            <!-- Nombre -->
                            <div class="form-group mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <div class="position-relative">
                                    <input type="text"
                                           id="nombre"
                                           th:field="*{nombre}"
                                           class="form-control"
                                           placeholder="Ingresa el nombre completo"
                                           required minlength="2" maxlength="100">
                                    <i class="bi bi-person position-absolute end-0 me-3 top-50 translate-middle-y text-muted"></i>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <!-- Identificación -->
                            <div class="form-group mb-3">
                                <label for="identificacion" class="form-label">Identificación</label>
                                <input type="text"
                                       id="identificacion"
                                       th:field="*{identificacion}"
                                       class="form-control"
                                       placeholder="Ej. CC, TI, etc."
                                       maxlength="50">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('identificacion')}" th:errors="*{identificacion}"></div>
                            </div>

                            <!-- Email -->
                            <div class="form-group mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="ejemplo@dominio.com"
                                       maxlength="100">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Teléfono -->
                            <div class="form-group mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel"
                                       id="telefono"
                                       th:field="*{telefono}"
                                       class="form-control"
                                       placeholder="+57 300 123 4567"
                                       maxlength="20">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                            </div>

                            <!-- Estación (solo lectura) -->
                            <div class="form-group mb-3">
                                <label class="form-label">Estación Asignada</label>
                                <input type="hidden" th:field="*{estacion.idestacion}" />
                                <input type="text"
                                       class="form-control"
                                       th:value="${empleado.estacion?.nombre ?: 'No asignada'}"
                                       readonly>
                            </div>
                        </div>

                        <!-- Columna 2: Cuenta y rol -->
                        <div class="col-12 col-lg-6">
                            <h5 class="mb-3 text-secondary fw-semibold">
                                <i class="bi bi-shield-lock me-2"></i>Cuenta y Acceso
                            </h5>

                            <!-- Usuario -->
                            <div class="form-group mb-3">
                                <label for="usuario" class="form-label">Nombre de Usuario</label>
                                <div class="position-relative">
                                    <input type="text"
                                           id="usuario"
                                           th:field="*{usuario}"
                                           class="form-control"
                                           placeholder="usuario_unico"
                                           required minlength="3" maxlength="50"
                                           pattern="[a-zA-Z0-9_]+"
                                           title="Solo letras, números y guiones bajos">
                                    <i class="bi bi-at position-absolute end-0 me-3 top-50 translate-middle-y text-muted"></i>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}"></div>
                            </div>

                            <!-- Contraseña -->
                            <div class="form-group mb-4">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <div class="position-relative password-container">
                                    <input type="password"
                                           id="contrasena"
                                           th:field="*{contrasena}"
                                           class="form-control"
                                           placeholder="Mínimo 6 caracteres"
                                           required minlength="6">
                                    <button type="button" class="btn btn-outline-secondary btn-sm password-toggle position-absolute end-0 top-50 translate-middle-y me-2"
                                            id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>

                                <!-- Barra de fortaleza (opcional) -->
                                <div class="password-strength mt-2">
                                    <div class="strength-bar rounded">
                                        <div id="strengthFill" class="strength-fill rounded"></div>
                                    </div>
                                    <div id="strengthText" class="text-muted small">Ingresa una contraseña segura</div>
                                </div>
                            </div>

                            <!-- Rol -->
                            <div class="form-group">
                                <label class="form-label d-block mb-2">
                                    <i class="bi bi-person-badge me-2"></i>Rol del Empleado
                                </label>
                                <div class="role-option p-3 rounded mb-2" data-role="EMPLEADO">
                                    <label class="d-flex align-items-center cursor-pointer">
                                        <input type="radio" name="rol" value="EMPLEADO" th:field="*{rol}" class="me-3" />
                                        <div class="flex-grow-1">
                                            <strong>Empleado</strong>
                                            <div class="text-muted small">Acceso básico al sistema</div>
                                        </div>
                                        <span class="badge bg-primary ms-2">Empleado</span>
                                    </label>
                                </div>
                                <div class="role-option p-3 rounded mb-2" data-role="SUPERVISOR">
                                    <label class="d-flex align-items-center cursor-pointer">
                                        <input type="radio" name="rol" value="SUPERVISOR" th:field="*{rol}" class="me-3" />
                                        <div class="flex-grow-1">
                                            <strong>Supervisor</strong>
                                            <div class="text-muted small">Supervisión y reportes</div>
                                        </div>
                                        <span class="badge bg-success ms-2">Supervisor</span>
                                    </label>
                                </div>
                                <div class="role-option p-3 rounded" data-role="ADMIN">
                                    <label class="d-flex align-items-center cursor-pointer">
                                        <input type="radio" name="rol" value="ADMIN" th:field="*{rol}" class="me-3" />
                                        <div class="flex-grow-1">
                                            <strong>Administrador</strong>
                                            <div class="text-muted small">Acceso completo al sistema</div>
                                        </div>
                                        <span class="badge bg-danger ms-2">Admin</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Botón de acción -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg" id="saveBtn">
                            <i class="bi bi-check-circle me-2"></i>
                            <span th:text="${empleado.idEmpleado != null} ? 'Actualizar Empleado' : 'Crear Empleado'">Guardar Empleado</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Elementos del DOM
        const form = document.getElementById('employeeForm');
        const saveBtn = document.getElementById('saveBtn');
        const passwordInput = document.getElementById('contrasena');
        const togglePassword = document.getElementById('togglePassword');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const roleOptions = document.querySelectorAll('.role-option');

        // Toggle de contraseña
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            const icon = this.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });

        // Validación de fortaleza de contraseña
        passwordInput.addEventListener('input', function () {
            const password = this.value;
            let strength = 0;
            let strengthClass = '';
            let strengthLabel = '';

            if (password.length >= 6)
                strength++;
            if (password.match(/[a-z]/))
                strength++;
            if (password.match(/[A-Z]/))
                strength++;
            if (password.match(/[0-9]/))
                strength++;
            if (password.match(/[^a-zA-Z0-9]/))
                strength++;

            switch (strength) {
                case 0:
                case 1:
                    strengthClass = 'strength-weak';
                    strengthLabel = 'Muy débil';
                    break;
                case 2:
                    strengthClass = 'strength-fair';
                    strengthLabel = 'Débil';
                    break;
                case 3:
                    strengthClass = 'strength-good';
                    strengthLabel = 'Buena';
                    break;
                case 4:
                case 5:
                    strengthClass = 'strength-strong';
                    strengthLabel = 'Fuerte';
                    break;
            }

            strengthFill.className = `strength-fill ${strengthClass}`;
            strengthText.textContent = password.length > 0 ? `Fortaleza: ${strengthLabel}` : 'Ingresa una contraseña';
        });

        // Manejo de selección de roles
        roleOptions.forEach(option => {
            option.addEventListener('click', function () {
                // Remover selección anterior
                roleOptions.forEach(opt => opt.classList.remove('selected'));

                // Seleccionar actual
                this.classList.add('selected');

                // Marcar radio button
                const radio = this.querySelector('input[type="radio"]');
                radio.checked = true;
            });
        });

        // Marcar rol seleccionado al cargar
        const selectedRole = document.querySelector('input[name="rol"]:checked');
        if (selectedRole) {
            const roleOption = selectedRole.closest('.role-option');
            if (roleOption) {
                roleOption.classList.add('selected');
            }
        }

        // Validación en tiempo real
        const inputs = form.querySelectorAll('input[required]');
        inputs.forEach(input => {
            input.addEventListener('blur', validateField);
            input.addEventListener('input', function () {
                if (this.classList.contains('is-invalid')) {
                    validateField.call(this);
                }
            });
        });

        function validateField() {
            const isValid = this.checkValidity();
            this.classList.toggle('is-valid', isValid);
            this.classList.toggle('is-invalid', !isValid);
        }

        // Validación del formulario
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Validar todos los campos
            let isFormValid = true;
            inputs.forEach(input => {
                validateField.call(input);
                if (!input.checkValidity()) {
                    isFormValid = false;
                }
            });

            // Validar que se haya seleccionado un rol
            const roleSelected = document.querySelector('input[name="rol"]:checked');
            if (!roleSelected) {
                isFormValid = false;
                // Mostrar mensaje de error para rol
                alert('Por favor selecciona un rol para el empleado');
                return;
            }

            if (isFormValid) {
                // Mostrar estado de carga
                saveBtn.classList.add('loading');
                saveBtn.innerHTML = '<span>Guardando...</span>';

                // Enviar formulario
                setTimeout(() => {
                    this.submit();
                }, 500);
            } else {
                // Scroll al primer campo inválido
                const firstInvalid = form.querySelector('.is-invalid');
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({behavior: 'smooth', block: 'center'});
                    firstInvalid.focus();
                }
            }
        });

        // Prevenir zoom en iOS
        if (window.innerWidth < 768) {
            inputs.forEach(input => {
                input.addEventListener('focus', function () {
                    document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0');
                });

                input.addEventListener('blur', function () {
                    document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0');
                });
            });
        }

        // Animación de entrada
        setTimeout(() => {
            document.querySelector('.form-card').style.opacity = '1';
            document.querySelector('.form-card').style.transform = 'translateY(0)';
        }, 100);
    });
</script>
</body>
</html>
