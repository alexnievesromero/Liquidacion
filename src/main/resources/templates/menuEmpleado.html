<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- ✅ IMPORTANTE PARA RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/menus.css}">
</head>

<body>
<div class="main-container">

    <!-- HEADER -->
    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-cog"></i>
                    </div>
                    <div>
                        <h1 class="header-title">PANEL EMPLEADO</h1>
                        <p class="header-subtitle">Sistema de Gestión de Combustibles</p>
                    </div>
                </div>

                <form th:action="@{/logout}" method="post" class="w-100 w-md-auto">
                    <button type="submit"
                            class="btn btn-danger logout-btn w-100 w-md-auto">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">
        <div class="container">

            <!-- MENSAJE ÉXITO -->
            <div th:if="${mensajeExito}" class="alert alert-success">
                <p th:text="${mensajeExito}"></p>

                <a th:if="${turnoId != null}"
                   th:href="@{'/liquidar/reporte?turnoId=' + ${turnoId}}"
                   class="btn btn-sm btn-outline-danger mt-2 d-inline-flex align-items-center gap-2">
                    <i class="fas fa-file-pdf"></i>
                    Descargar PDF del Turno
                </a>
            </div>

            <!-- INFO EMPLEADO (❌ sin container anidado) -->
            <div class="py-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>
                            <strong th:text="${session.empleado.nombre}"></strong>
                        </h4>
                        <p>
                            <strong>Estación:</strong>
                            <span th:text="${session.empleado.estacion.nombre}">
                                Sin estación
                            </span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- MENÚ -->
            <div class="menu-grid">

                <a th:href="@{/liquidar}" class="menu-card">
                    <div class="menu-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h3 class="menu-title">Liquidar Turno</h3>
                    <p class="menu-description">
                        Registra tus ventas en cada turno.
                    </p>
                    <div class="menu-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a th:href="@{/historialpdf}" class="menu-card">
                    <div class="menu-icon">
                        <i class="fas fa-box"></i>
                    </div>
                    <h3 class="menu-title">Historial de Turnos</h3>
                    <p class="menu-description">
                        Descarga una copia de tus turnos.
                    </p>
                    <div class="menu-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a th:href="@{/descargue}" class="menu-card">
                    <div class="menu-icon">
                        <i class="fas fa-truck"></i>
                    </div>
                    <h3 class="menu-title">Descarga de Combustible</h3>
                    <p class="menu-description">
                        Registra y controla las descargas de combustible.
                    </p>
                    <div class="menu-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragment/footer :: footer}"></footer>

</div>
</body>
</html>
