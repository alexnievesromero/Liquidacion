<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de cambios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="bg-light p-4">

<div class="container">

    <div class="mb-3">
        <a th:href="@{/liquidar/ventas/{id}(id=${ventaId})}"
           class="btn btn-outline-secondary">
            &larr; Volver a revisión
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">
                🕒 Historial de cambios – Venta #<span th:text="${ventaId}"></span>
            </h5>
        </div>

        <div class="card-body p-3">
            <div class="table-responsive">
                <table class="table table-striped table-bordered table-hover">
                    <thead class="table-success">
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Campo</th>
                        <th>Antes</th>
                        <th>Después</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="c : ${historial}">
                        <td th:text="${#temporals.format(c.fecha,'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${c.usuario}"></td>
                        <td th:text="${c.campo}"></td>
                        <td th:text="${c.valorAnterior != null ? c.valorAnterior : '-'}"></td>
                        <td th:text="${c.valorNuevo != null ? c.valorNuevo : '-'}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(historial)}">
                        <td colspan="5" class="text-center text-muted">
                            No hay cambios registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
