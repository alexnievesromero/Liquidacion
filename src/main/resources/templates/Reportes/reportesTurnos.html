<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Reporte de Ventas</title>

    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.png}" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- Bootstrap Icons (FALTABA) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet"/>

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/reportesTurnos.css}">
</head>

<body class="p-4 bg-light">

<!-- 🔹 HEADER -->
<div class="main-header mb-4">
    <div class="container text-center">
        <h2>📊 Reporte de Ventas por Turno</h2>
    </div>

    <div class="container mt-3">
        <a th:href="@{/menuAdmin}" class="btn-back">
            <i class="bi bi-arrow-left me-2"></i>
            <span class="d-none d-sm-inline">Regresar al menú</span>
            <span class="d-sm-none">Volver</span>
        </a>
    </div>
</div>

<div class="container">

    <!-- 🔍 FILTROS -->
    <div class="filter-card mb-4">
        <h5 class="section-title">🔍 Filtros de Búsqueda</h5>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Búsqueda General</label>
                <input type="text" id="buscador" class="form-control"
                       placeholder="Buscar general...">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Filtro por Fecha</label>
                <input type="date" id="filtroFecha" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold">Número de Turno</label>
                <input type="number" id="filtroNumeroTurno"
                       class="form-control"
                       placeholder="Número de turno (1-3)"
                       min="1" max="3">
            </div>
        </div>
    </div>

    <!-- 📤 EXPORTAR -->
    <div class="export-section mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="section-title mb-0">📤 Exportar Datos</h5>

            <div class="d-flex gap-2 flex-wrap">
                <form id="formExportExcel" method="get" action="/Reportes/excel">
                    <input type="hidden" name="fecha" id="inputFechaExcel">
                    <input type="hidden" name="numeroTurno" id="inputTurnoExcel">
                    <input type="hidden" name="busqueda" id="inputBusquedaExcel">

                    <button type="submit" class="btn btn-gradient btn-success-gradient">
                        📊 Exportar a EXCEL
                    </button>
                </form>

                <form id="formExportPdf" method="get" action="/Reportes/Pdf">
                    <input type="hidden" name="fecha" id="inputFechaPdf">
                    <input type="hidden" name="numeroTurno" id="inputTurnoPdf">

                    <button type="submit" class="btn btn-gradient btn-danger-gradient">
                        📄 Exportar a PDF
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 📋 TABLA -->
    <div class="table-container mb-4">
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Empleado</th>
                    <th>Estación</th>
                    <th>Isla</th>
                    <th>N° Turno</th>
                    <th>Turno</th>
                    <th>Fecha</th>
                    <th>Venta Total</th>
                    <th>Acciones</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="r : ${datos}">
                    <td th:text="${r.idVentas}"></td>

                    <td th:text="${r.turno.empleado.nombre}" class="fw-semibold"></td>

                    <td th:text="${r.estacion.nombre}"></td>

                    <td th:text="${r.turno.isla.isla}" class="fw-bold text-primary"></td>

                    <td>
        <span class="badge bg-secondary fs-6"
              th:text="${r.turno.numeroTurno}">
        </span>
                    </td>

                    <td th:text="${r.turno.turno}"></td>

                    <td th:text="${r.turno.fecha}"></td>

                    <td th:text="${r.venta_total}" class="fw-bold text-success"></td>

                    <td>
                        <a class="btn btn-gradient btn-info-gradient btn-sm"
                           th:href="@{/liquidar/ventas/{id}/revisar(id=${r.idVentas})}">
                            👁️ Revisar
                        </a>
                    </td>

                    <td>
        <span th:id="'estado-' + ${r.idVentas}"
              th:class="|badge ${
              r.estado == 'pendiente' ? 'bg-warning text-dark' :
              r.estado == 'aprobado' ? 'bg-primary' :
              r.estado == 'cerrado' ? 'bg-danger' : 'bg-secondary'
              }|"
              th:text="${r.estado}">
        </span>
                    </td>
                </tr>
                </tbody>
            </table>
            <nav th:if="${totalPaginas > 1}">
                <ul class="pagination justify-content-center">

                    <li class="page-item"
                        th:classappend="${paginaActual == 0} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/Reportes/reportesTurnos(page=${paginaActual - 1})}">
                            ⬅ Anterior
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                        th:classappend="${i == paginaActual} ? 'active'">

                        <a class="page-link"
                           th:href="@{/Reportes/reportesTurnos(page=${i})}"
                           th:text="${i + 1}">
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/Reportes/reportesTurnos(page=${paginaActual + 1})}">
                            Siguiente ➡
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>

<!-- MODAL (se deja igual, solo estructura válida) -->
<div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">📝 Detalles Completos de Venta</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="detalle-id">
                <!-- CONTENIDO CONTROLADO POR JS -->
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">❌ Cerrar</button>
                <button class="btn btn-warning" id="btnEditarCampos">✏️ Editar</button>
                <button class="btn btn-success"
                        onclick="accionModal('aprobado')">💾 Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script th:src="@{/js/reportesTurnos.js}"></script>

</body>
</html>
